<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App</title>
    <script type="module" src="/src/components/snack-bar"></script>
    <style>
      .snack-style {
        background-color: #333;
        color: #fff;
        padding: 16px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <y-snack-bar id="snack-bar" open="true" class="snack-style">
      <template>This is a snackbar message!</template>
    </y-snack-bar>

    <button id="open-snackbar" onclick="document.getElementById('snack-bar').open()">Open Snackbar</button>
  </body>
</html>
